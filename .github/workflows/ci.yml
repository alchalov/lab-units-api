# CI для LabUnits API: тесты -> smoke-проверка запуска -> артефакт.
name: FastAPI CI

on:
  push:
  pull_request:

# Workflow только читает код репозитория
permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 — основная версия проекта, 3.13 — проверка на более новой
        python-version: ["3.12", "3.13"]

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  smoke:
    name: Smoke test (real uvicorn)
    needs: test
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ci-${{ github.run_number }}
      LOG_LEVEL: INFO

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies only
        run: python -m pip install -r requirements.txt

      - name: Start service
        run: |
          python -m uvicorn app_final:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:8000/health && exit 0
            sleep 0.5
          done
          echo "Service did not start"
          cat uvicorn.log
          exit 1

      - name: Check /health, /version and main route
        run: |
          curl -fs http://127.0.0.1:8000/health
          curl -fs http://127.0.0.1:8000/version | grep "$APP_VERSION"
          curl -fs "http://127.0.0.1:8000/convert/glucose?value=5.5" | grep "99.11"

      - name: Show service logs
        if: always()
        run: cat uvicorn.log

  package:
    name: Package application
    needs: smoke
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Upload tested application
        uses: actions/upload-artifact@v7
        with:
          name: lab-units-api
          path: |
            app_final.py
            requirements.txt
            .env.example
            README.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
